name: Regresja danych BigQuery

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *'   # codziennie 7:00 czasu polskiego
  workflow_dispatch:       # przycisk "Run workflow" do ręcznego uruchomienia

jobs:
  testy-danych:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: krystian-project-510215
      BQ_DATASET: raw
      BQ_LOCATION: EU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: npx playwright test --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-playwright
          path: playwright-report/
          retention-days: 14
